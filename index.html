<style>
:root{
  --bg:#f5f7f5; --surface:#ffffff; --surface-2:#eef1ef; --surface-3:#e3e8e4;
  --ink:#18222b; --ink-2:#47555f; --ink-3:#7c8a92;
  --line:#d5ddd7; --line-2:#c3ccc6;
  --accent:#2e7d5b; --accent-ink:#1f5b41; --accent-soft:#d9ece3;
  --has-fill:#84c4a6; --has-stroke:#1f5b41;
  --map-ground:#f4f1e9; --neutral-lot:#e3e1d3; --neutral-lot-ink:#57533f;
  --shadow:0 6px 24px rgba(20,30,25,.14), 0 2px 6px rgba(20,30,25,.08);
  --s-1:#344d8f; --s-3:#4f8fc0; --s-5:#d49028; --s-6:#c23b31; --s-9:#b9b53f; --s-0:#b8b7a6;
  --danger:#c23b31;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "Roboto Mono", Menlo, Consolas, monospace;
  --safe-t: env(safe-area-inset-top,0px); --safe-b: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151b; --surface:#19212a; --surface-2:#212b35; --surface-3:#2b3742;
  --ink:#e8eef1; --ink-2:#a7b4bd; --ink-3:#748089;
  --line:#2b3742; --line-2:#38454f;
  --accent:#4bb98c; --accent-ink:#7fd4ac; --accent-soft:#1e3a30;
  --has-fill:#2f6f56; --has-stroke:#6fd0a8;
  --map-ground:#20262a; --neutral-lot:#39413f; --neutral-lot-ink:#c2cbc4;
  --shadow:0 8px 28px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
  --s-0:#5c6360;
}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#19212a; --surface-2:#212b35; --surface-3:#2b3742;
  --ink:#e8eef1; --ink-2:#a7b4bd; --ink-3:#748089;
  --line:#2b3742; --line-2:#38454f;
  --accent:#4bb98c; --accent-ink:#7fd4ac; --accent-soft:#1e3a30;
  --has-fill:#2f6f56; --has-stroke:#6fd0a8;
  --map-ground:#20262a; --neutral-lot:#39413f; --neutral-lot-ink:#c2cbc4;
  --shadow:0 8px 28px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.4);
  --s-0:#5c6360;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---- Top bar ---- */
#topbar{position:absolute;top:0;left:0;right:0;z-index:30;padding:calc(var(--safe-t) + 8px) 10px 8px;
  display:flex;gap:8px;align-items:center;
  background:linear-gradient(var(--bg),color-mix(in srgb,var(--bg) 70%,transparent) 70%,transparent)}
.search-wrap{flex:1;position:relative;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:11px;width:17px;height:17px;color:var(--ink-3);pointer-events:none}
#search{width:100%;height:42px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:12px;padding:0 12px 0 34px;font-size:15px;box-shadow:var(--shadow)}
#search:focus{outline:none;border-color:var(--accent)}
.iconbtn{width:42px;height:42px;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:12px;display:grid;place-items:center;box-shadow:var(--shadow)}
.iconbtn svg{width:19px;height:19px}
.iconbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

#results{position:absolute;top:calc(var(--safe-t) + 58px);left:10px;right:10px;z-index:29;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  max-height:52vh;overflow:auto;display:none}
#results.show{display:block}
.res{display:flex;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.res:last-child{border-bottom:none}
.res:active{background:var(--surface-2)}
.res .ra{font-family:var(--mono);font-size:12px;color:var(--ink-3);flex:none;width:64px}
.res .rn{font-size:14px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rt{font-size:11px;color:var(--ink-2)}
.res-empty{padding:16px;color:var(--ink-3);font-size:14px;text-align:center}

/* ---- Map ---- */
#mapview{position:absolute;inset:0;touch-action:none;background:var(--bg);overflow:hidden}
#svgwrap{position:absolute;inset:0}
#map{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#map .lot{stroke:var(--line-2);stroke-width:1.4;fill:var(--neutral-lot);transition:fill .18s,stroke .18s}
#map .lot.has{fill:var(--has-fill);stroke:var(--has-stroke);stroke-width:2.6}
#map.mode-status .lot.s1{fill:var(--s-1)}#map.mode-status .lot.s3{fill:var(--s-3)}
#map.mode-status .lot.s5{fill:var(--s-5)}#map.mode-status .lot.s6{fill:var(--s-6)}
#map.mode-status .lot.s9{fill:var(--s-9)}
#map .lot.sel{stroke:var(--ink);stroke-width:3.4}
#map .lotnum{fill:var(--neutral-lot-ink);font-family:var(--mono);font-size:15px;font-weight:600;text-anchor:middle;
  pointer-events:none;dominant-baseline:central}
#map .lotnum.hn{fill:var(--has-stroke);font-weight:700}
#map.mode-status .lotnum.act{fill:#fff}
#map .pin{fill:#1e7052;stroke:#fff;stroke-width:2.2;pointer-events:none}
#map .pcount{fill:#fff;font-family:var(--font);font-weight:700;text-anchor:middle;
  dominant-baseline:central;pointer-events:none}
#map .streetlbl{fill:#33383d;stroke:#fff;stroke-width:5;paint-order:stroke;stroke-linejoin:round;
  font-family:var(--font);font-weight:600;text-anchor:middle;dominant-baseline:central}

/* ---- Bottom controls ---- */
#botbar{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(var(--safe-b) + 8px);
  display:flex;gap:8px;align-items:flex-end;pointer-events:none;
  background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 78%,transparent) 42%)}
#botbar>*{pointer-events:auto}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.seg button{border:none;background:transparent;color:var(--ink-2);padding:0 14px;height:42px;font-size:13.5px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.spacer{flex:1}
#zoomcol{display:flex;flex-direction:column;gap:6px}
.zbtn{width:42px;height:42px}
#legend{position:absolute;left:10px;bottom:calc(var(--safe-b) + 60px);z-index:22;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:9px 11px;display:none;max-width:190px}
#legend.show{display:block}
#legend h4{margin:0 0 7px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.leg{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:5px 0;color:var(--ink-2)}
.leg i{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.15)}

/* ---- List view ---- */
#listview{position:absolute;inset:0;z-index:15;background:var(--bg);display:none;flex-direction:column;
  padding-top:calc(var(--safe-t) + 58px)}
#listview.show{display:flex}
#listscroll{flex:1;overflow:auto;padding:4px 10px calc(var(--safe-b) + 76px)}
.lgroup{margin:16px 2px 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.lrow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:11px 13px;margin-bottom:8px}
.lrow:active{background:var(--surface-2)}
.lrow .laddr{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.lrow .lname{font-size:15px;font-weight:600;margin-top:1px}
.lrow .lppl{font-size:13px;color:var(--ink-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lstat{margin-left:auto;flex:none}
.avstack{display:flex;flex:none}
.avstack .av{width:34px;height:34px;border-radius:50%;margin-left:-9px;border:2px solid var(--surface);
  background:var(--surface-3);overflow:hidden;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-2)}
.avstack .av:first-child{margin-left:0}
.avstack .av img{width:100%;height:100%;object-fit:cover}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:999px;white-space:nowrap;
  text-transform:uppercase;color:#fff}
.pill.s1{background:var(--s-1)}.pill.s3{background:var(--s-3)}.pill.s5{background:var(--s-5)}
.pill.s6{background:var(--s-6)}.pill.s9{background:var(--s-9)}.pill.s0{background:var(--s-0)}
.list-empty{text-align:center;color:var(--ink-3);padding:60px 20px;font-size:15px;line-height:1.5}

/* ---- Sheet / modal ---- */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(10,16,14,.5);opacity:0;pointer-events:none;
  transition:opacity .22s}
#scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);
  border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.28);
  transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:92vh;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.sheet.show{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:9px auto 2px;flex:none}
.sheet-head{padding:6px 18px 12px;border-bottom:1px solid var(--line);flex:none}
.sheet-head .eyebrow{font-family:var(--mono);font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet-head h2{margin:4px 0 0;font-size:20px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sheet-head .sub{font-size:13px;color:var(--ink-2);margin-top:3px}
.sheet-body{overflow:auto;padding:6px 16px 16px;flex:1}
.section-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700;
  margin:16px 4px 8px;display:flex;align-items:center;justify-content:space-between}

.person{display:flex;gap:12px;align-items:flex-start;padding:11px;border:1px solid var(--line);
  border-radius:13px;margin-bottom:9px;background:var(--surface)}
.person .pav{width:52px;height:52px;border-radius:13px;flex:none;overflow:hidden;background:var(--surface-3);
  display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--ink-2)}
.person .pav img{width:100%;height:100%;object-fit:cover}
.person .pinfo{flex:1;min-width:0}
.person .pn{font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;
  background:var(--surface-3);color:var(--ink-2)}
.tag.pet{background:var(--accent-soft);color:var(--accent-ink)}
.person .pnote{font-size:13.5px;color:var(--ink-2);margin-top:3px;line-height:1.4;white-space:pre-wrap}
.person .pedit{border:none;background:transparent;color:var(--ink-3);padding:4px;flex:none}
.person .pedit svg{width:18px;height:18px;display:block}
.empty-ppl{color:var(--ink-3);font-size:14px;padding:6px 4px 2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;padding:0 18px;
  border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:15px;font-weight:600}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn:active{transform:translateY(1px)}
.row-btns{display:flex;gap:9px;margin-top:6px}

label.fld{display:block;margin:12px 0}
label.fld .lab{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px;display:block}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:11px;
  padding:11px 12px;font-size:16px;font-family:inherit}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:74px;line-height:1.4}
.kindsel{display:flex;gap:8px}
.kindsel button{flex:1;height:44px;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  border-radius:11px;font-size:14px;font-weight:600}
.kindsel button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.photopick{display:flex;gap:12px;align-items:center;margin:12px 0}
.photopick .pv{width:64px;height:64px;border-radius:14px;background:var(--surface-3);overflow:hidden;
  display:grid;place-items:center;color:var(--ink-3);flex:none}
.photopick .pv img{width:100%;height:100%;object-fit:cover}
.mini{font-size:13px;color:var(--accent-ink);background:none;border:none;padding:6px 4px;font-weight:600}

.field-note{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin:4px 2px}
.field-note code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px;
  word-break:break-all}
.menu-item{display:flex;gap:13px;align-items:center;width:100%;text-align:left;border:none;background:transparent;
  color:var(--ink);padding:14px 6px;font-size:15.5px;border-bottom:1px solid var(--line)}
.menu-item svg{width:20px;height:20px;color:var(--ink-2);flex:none}
.menu-item small{display:block;color:var(--ink-3);font-size:12.5px;font-weight:400;margin-top:2px}
.menu-item:last-child{border-bottom:none}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 90px);transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:14px;font-weight:600;
  z-index:60;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const STATUS_CLASSES = {0:'s0',1:'s1',3:'s3',5:'s5',6:'s6',9:'s9'};
const ACTIVE_STATUS = new Set([1,3,5,6,9]);
const byId = {}; LOTS.forEach(l=>byId[l.id]=l);
const $ = s=>document.querySelector(s);

/* ---------------- storage (IndexedDB single record, localStorage fallback) --------------- */
const Store = (()=>{
  let db=null, mem=null, useLS=false;
  const KEY='ccneighbors', LS='ccneighbors_v1';
  function open(){return new Promise(res=>{
    let ok=false;
    try{
      const rq=indexedDB.open('ccneighbors',1);
      rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');
      rq.onsuccess=()=>{db=rq.result;ok=true;res();};
      rq.onerror=()=>{useLS=true;res();};
      setTimeout(()=>{if(!ok&&!db){useLS=true;res();}},1500);
    }catch(e){useLS=true;res();}
  });}
  async function load(){
    if(useLS||!db){try{return JSON.parse(localStorage.getItem(LS))||null;}catch(e){return null;}}
    return new Promise(res=>{try{
      const tx=db.transaction('kv','readonly').objectStore('kv').get(KEY);
      tx.onsuccess=()=>res(tx.result||null); tx.onerror=()=>res(null);
    }catch(e){res(null);}});
  }
  async function save(state){
    mem=state;
    if(useLS||!db){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){toast('Storage full — remove some photos');}return;}
    return new Promise(res=>{try{
      const tx=db.transaction('kv','readwrite').objectStore('kv').put(state,KEY);
      tx.onsuccess=()=>res(); tx.onerror=()=>{try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}res();};
    }catch(e){res();}});
  }
  return {open,load,save};
})();

let STATE={version:1, units:{}, status:{}, statusUpdated:DATA.captured};
let saveTimer=null;
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>Store.save(STATE),250);}
function unit(id){ if(!STATE.units[id]) STATE.units[id]={people:[]}; return STATE.units[id]; }
function peopleOf(id){ return (STATE.units[id]&&STATE.units[id].people)||[]; }
function effStatus(l){ const o=STATE.status[l.id]; return o?o.status:l.status; }
function effStatusLabel(l){ const o=STATE.status[l.id]; return o?o.statusLabel:l.statusLabel; }
function effPrice(l){ const o=STATE.status[l.id]; return o?o.price:l.price; }
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------------- map build ---------------- */
let mode='neighbors', view='map';
const mapEl=$('#map');
function buildMap(){
  const vb=DATA.viewBox.split(' ').map(Number);
  mapEl.setAttribute('viewBox',DATA.viewBox);
  mapEl.setAttribute('width',vb[2]); mapEl.setAttribute('height',vb[3]);
  // base map (roads/greens) injected as a group
  const base=document.createElementNS('http://www.w3.org/2000/svg','g');
  const tmp=document.createElement('div'); tmp.innerHTML=BASEMAP;
  const src=tmp.querySelector('svg');
  base.setAttribute('id','basegrp');
  while(src && src.firstChild){ base.appendChild(src.firstChild); }
  mapEl.appendChild(base);
  // lots layer
  const lg=document.createElementNS('http://www.w3.org/2000/svg','g'); lg.id='lotsgrp';
  LOTS.forEach(l=>{
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',l.d); p.setAttribute('class','lot'); p.dataset.id=l.id;
    lg.appendChild(p);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',l.cx); t.setAttribute('y',l.cy); t.setAttribute('class','lotnum'); t.dataset.id=l.id;
    t.textContent=mapLabel(l); lg.appendChild(t);
  });
  mapEl.appendChild(lg);
  // cache each lot's bounding box so markers can be placed inside the unit
  LOTS.forEach(l=>{ try{const bb=mapEl.querySelector('.lot[data-id="'+l.id+'"]').getBBox();
    l._bb={x:bb.x,y:bb.y,w:bb.width,h:bb.height};}catch(e){} });
  // artwork overlay above the lots: parking-stall lines + trees (non-interactive)
  const ons='http://www.w3.org/2000/svg';
  const ov=document.createElementNS(ons,'g'); ov.id='mapoverlay'; ov.setAttribute('pointer-events','none');
  if(OVERLAY.parkingLines){
    const pl=document.createElementNS(ons,'path'); pl.setAttribute('d',OVERLAY.parkingLines);
    pl.setAttribute('fill','none'); pl.setAttribute('stroke','#6d6e71'); pl.setAttribute('stroke-width','1');
    ov.appendChild(pl);
  }
  (OVERLAY.trees||[]).forEach(t=>{
    const u=document.createElementNS(ons,'use');
    u.setAttribute('width','18.905'); u.setAttribute('height','20.2');
    u.setAttribute('transform','translate('+t[0]+' '+t[1]+')scale('+t[2]+')');
    u.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href','#Tree2');
    u.setAttribute('href','#Tree2');
    ov.appendChild(u);
  });
  (OVERLAY.streets||[]).forEach(s=>{

function refreshMap(){
  mapEl.className.baseVal='mode-'+mode;

    const path=mapEl.querySelector('.lot[data-id="'+l.id+'"]');

    const n=peopleOf(l.id).length;

/* ---------------- pan / zoom ---------------- */
const T={x:0,y:0,k:1};
let minK=0.2,maxK=6;
function applyT(){ mapEl.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.k})`; }
function fitMap(){
  const w=$('#mapview').clientWidth, h=$('#mapview').clientHeight;
  const vb=DATA.viewBox.split(' ').map(Number);
  const k=Math.min(w/vb[2], h/vb[3])*0.98;
  minK=k*0.6; maxK=k*10;
  T.k=k; T.x=(w-vb[2]*k)/2; T.y=(h-vb[3]*k)/2; applyT();
}
function clampT(){
  T.k=Math.max(minK,Math.min(maxK,T.k));
}
(function panzoom(){
  const el=$('#mapview'); let pts=new Map(), last=null, pinch=null, moved=0, downT=0;
  el.addEventListener('pointerdown',e=>{
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    moved=0; downT=Date.now();
    if(pts.size===1) last={x:e.clientX,y:e.clientY};
    if(pts.size===2){const a=[...pts.values()];pinch={d:dist(a[0],a[1]),cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,k:T.k,x:T.x,y:T.y};}
  });
  el.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch){
      const a=[...pts.values()], d=dist(a[0],a[1]);
      let k=pinch.k*(d/pinch.d); k=Math.max(minK,Math.min(maxK,k));
      const r=el.getBoundingClientRect(), cx=pinch.cx-r.left, cy=pinch.cy-r.top;
      const wx=(cx-pinch.x)/pinch.k, wy=(cy-pinch.y)/pinch.k;
      T.k=k; T.x=cx-wx*k; T.y=cy-wy*k; applyT(); moved+=10; return;
    }
    if(pts.size===1&&last){
      const dx=e.clientX-last.x, dy=e.clientY-last.y; moved+=Math.abs(dx)+Math.abs(dy);
      T.x+=dx; T.y+=dy; last={x:e.clientX,y:e.clientY}; applyT();
    }
  });
  function up(e){
    const wasTap = pts.has(e.pointerId) && pts.size===1 && moved<8 && Date.now()-downT<400;
    pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    if(pts.size===1){const p=[...pts.values()][0];last={x:p.x,y:p.y};}
    if(pts.size===0){ last=null;
      if(wasTap) tapAt(e.clientX,e.clientY);
    }
  }
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  function tapAt(x,y){
    const hit=document.elementFromPoint(x,y); // hit-test the lot under the finger

    const lot=hit&&hit.closest?hit.closest('.lot'):null;
    if(lot) openSheet(+lot.dataset.id);
  }
  el.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=el.getBoundingClientRect(), cx=e.clientX-r.left, cy=e.clientY-r.top;
    const f=Math.exp(-e.deltaY*0.0015); let k=Math.max(minK,Math.min(maxK,T.k*f));
    const wx=(cx-T.x)/T.k, wy=(cy-T.y)/T.k; T.k=k; T.x=cx-wx*k; T.y=cy-wy*k; applyT();
  },{passive:false});
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
})();
function zoomBy(f){
  const el=$('#mapview'), cx=el.clientWidth/2, cy=el.clientHeight/2;
  let k=Math.max(minK,Math.min(maxK,T.k*f));
  const wx=(cx-T.x)/T.k, wy=(cy-T.y)/T.k; animateTo(cx-wx*k,cy-wy*k,k);
}
function animateTo(x,y,k){
  const s={x:T.x,y:T.y,k:T.k}, t0=performance.now(), dur=260;
  function step(t){const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    T.x=s.x+(x-s.x)*e; T.y=s.y+(y-s.y)*e; T.k=s.k+(k-s.k)*e; applyT();
    if(p<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}
function focusLot(id){
  const l=byId[id]; if(!l)return;
  const el=$('#mapview'), w=el.clientWidth, h=el.clientHeight;
  const k=Math.min(maxK, Math.max(T.k, minK*4.2));
  animateTo(w/2-l.cx*k, h*0.36-l.cy*k, k);
}

function editPerson(unitId,personId){
  const u=unit(unitId); const existing=personId?u.people.find(p=>p.id===personId):null;
  let draft=existing?{...existing}:{id:uid(),name:'',kind:'person',note:'',photo:null};
  const modal=document.createElement('div'); modal.className='sheet show'; modal.style.zIndex=42;
  modal.innerHTML=`

      </div>

        <button data-k="person" class="${draft.kind==='person'?'on':''}">Person</button>
        <button data-k="pet" class="${draft.kind==='pet'?'on':''}">Pet</button>
      </div>
      <label class="fld"><span class="lab">Name</span>
        <input class="inp" id="fName" placeholder="${draft.kind==='pet'?'e.g. Biscuit':'e.g. Sarah Chen'}" value="${esc(draft.name)}"></label>
      <label class="fld"><span class="lab">Notes <span style="color:var(--ink-3);font-weight:400">(optional)</span></span>
        <textarea class="inp" id="fNote" placeholder="Kids' names, car, works nights, met at the mailbox…">${esc(draft.note)}</textarea></label>
      <button class="btn primary block" id="savePerson" style="margin-top:6px">Save</button>
      ${existing?'<button class="btn danger block ghost" id="delPerson" style="margin-top:9px">Remove</button>':''}
    </div>`;
  document.body.appendChild(modal);
  const close=()=>{modal.classList.remove('show');setTimeout(()=>modal.remove(),280);};
  modal.querySelectorAll('.kindsel button').forEach(b=>b.onclick=()=>{
    draft.kind=b.dataset.k; modal.querySelectorAll('.kindsel button').forEach(x=>x.classList.toggle('on',x===b));
  });
  modal.querySelector('#pickPhoto').onclick=()=>modal.querySelector('#fileInp').click();
  const rm=modal.querySelector('#rmPhoto'); if(rm)rm.onclick=()=>{draft.photo=null;refreshEditorPhoto();};
  modal.querySelector('#fileInp').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    resizeImage(f,640,0.72).then(url=>{draft.photo=url;refreshEditorPhoto();});
  };
  function refreshEditorPhoto(){
    const box=modal.querySelector('#pvBox');
    box.innerHTML=draft.photo?`<img src="${draft.photo}">`:box.innerHTML;
    // simplest: re-render editor photo area
    modal.querySelector('#pickPhoto').textContent=draft.photo?'Change photo':'Add photo';
    if(draft.photo && !modal.querySelector('#rmPhoto')){
      const b=document.createElement('button'); b.className='mini'; b.id='rmPhoto'; b.textContent='Remove';
      b.onclick=()=>{draft.photo=null;refreshEditorPhoto();}; modal.querySelector('#pickPhoto').after(b);
    }
    if(!draft.photo){const r=modal.querySelector('#rmPhoto');if(r)r.remove();
      box.innerHTML=`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h3l1.5-2h7L18 7h2a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="12.5" r="3.2"/></svg>`;}

/* ---------------- search ---------------- */
const searchEl=$('#search'), resultsEl=$('#results');
searchEl.addEventListener('input',()=>runSearch(searchEl.value.trim()));
searchEl.addEventListener('focus',()=>{ if(searchEl.value.trim())runSearch(searchEl.value.trim()); });
function runSearch(q){
  if(!q){resultsEl.classList.remove('show');return;}
  const ql=q.toLowerCase(); const out=[];
  LOTS.forEach(l=>{
    const ppl=peopleOf(l.id);
    const names=ppl.map(p=>p.name).filter(Boolean);
    const nameHit=names.filter(n=>n.toLowerCase().includes(ql));
    const addrHit=(l.addr||'').toLowerCase().includes(ql) || ('lot '+l.lot)===ql || l.lot===q;
    if(nameHit.length||addrHit){
      out.push({l, label: nameHit.length?nameHit.join(', '):(l.addr||'Lot '+l.lot),
        sub: nameHit.length?(l.addr||'Lot '+l.lot):(ppl.length?ppl.map(p=>p.name).join(', '):effStatusLabel(l))});
    }
  });
  out.sort((a,b)=>(peopleOf(b.l.id).length)-(peopleOf(a.l.id).length));
  resultsEl.innerHTML = out.length? '' : '<div class="res-empty">No matches</div>';
  out.slice(0,40).forEach(o=>{
    const d=document.createElement('div'); d.className='res';
    d.innerHTML=`<span class="ra mono">LOT ${esc(o.l.lot)}</span><div style="flex:1;min-width:0"><div class="rn">${esc(o.label)}</div><div class="rt">${esc(o.sub)}</div></div>`;
    d.onclick=()=>{ resultsEl.classList.remove('show'); searchEl.blur();
      if(view==='list')setView('map'); openSheet(o.l.id); };
    resultsEl.appendChild(d);
  });
  resultsEl.classList.add('show');
}
document.addEventListener('click',e=>{
  if(!resultsEl.contains(e.target)&&e.target!==searchEl&&!$('.search-wrap').contains(e.target))
    resultsEl.classList.remove('show');
});

function renderList(){
  const scroll=$('#listscroll');
  const withPeople=LOTS.filter(l=>peopleOf(l.id).length).sort((a,b)=>(a.addr||'zz').localeCompare(b.addr||'zz'));
  const forSale=LOTS.filter(l=>ACTIVE_STATUS.has(effStatus(l))).sort((a,b)=>effStatus(a)-effStatus(b));
  let html='';
  if(!withPeople.length && !STATE._listedOnce){}
  html+=`<div class="lgroup">Neighbors you've added · ${withPeople.length}</div>`;
  if(!withPeople.length){
    html+='<div class="list-empty">No neighbors yet.<br>Tap a unit on the map to add who lives there.</div>';
  } else {
    withPeople.forEach(l=>html+=lrow(l,true));
  }
  html+=`<div class="lgroup">For sale &amp; in progress · ${forSale.length}</div>`;
  forSale.forEach(l=>html+=lrow(l,false));

function lrow(l,showPeople){

  const avs=ppl.slice(0,4).map(p=>`<div class="av">${p.photo?`<img src="${p.photo}">`:esc(initials(p.name)||(p.kind==='pet'?'🐾':'?'))}</div>`).join('');
  const price=effPrice(l);
  return `<div class="lrow" data-id="${l.id}">
    ${showPeople&&ppl.length?`<div class="avstack">${avs}</div>`:''}
    <div style="flex:1;min-width:0">
      <div class="laddr mono">${l.addr?esc(l.addr):'LOT '+esc(l.lot)}</div>
      ${showPeople?`<div class="lppl">${ppl.map(p=>esc(p.name||(p.kind==='pet'?'Pet':'Unnamed'))).join(' · ')}</div>`
        :`<div class="lname">Lot ${esc(l.lot)}${price?` · $${price.toLocaleString()}`:''}</div>`}

    <span class="lstat pill ${sc}">${esc(effStatusLabel(l))}</span></div>`;
}

function doBackup(){
  const blob=new Blob([JSON.stringify({app:'ccneighbors',v:1,exported:new Date().toISOString(),state:STATE},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='clear-creek-neighbors-backup.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Backup downloaded');
}
function doRestore(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result); const s=d.state||d;
      if(!s.units){toast('That file doesn’t look right');return;}
      STATE=Object.assign({version:1,units:{},status:{},statusUpdated:DATA.captured},s);
      persist(); refreshMap(); showSheet(false); toast('Neighbors restored');
    }catch(err){toast('Couldn’t read that file');}};
    r.readAsText(f);};
  inp.click();
}
function cycleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?null:'dark';
  if(next)document.documentElement.setAttribute('data-theme',next);
  else document.documentElement.removeAttribute('data-theme');
  try{localStorage.setItem('cctheme',next||'system');}catch(e){}
  toast('Theme: '+(next||'match phone'));
}
function openStatusUpdate(){
  const BM="javascript:(function(){try{var d=window.mkrData;if(!d){alert('Open the Clear Creek plat map first, then tap this.');return;}var a=Object.keys(d).map(function(k){var r=d[k];return{id:r.i,s:r.s,pr:r.pr||0}});var t=JSON.stringify(a);navigator.clipboard&&navigator.clipboard.writeText(t).then(function(){alert('Copied '+a.length+' units. Now paste into Neighbors.')},function(){prompt('Copy this:',t)});}catch(e){prompt('Copy this:',JSON.stringify(e.message));}})();";
  sheetEl.innerHTML=`
    <div class="grab"></div>
    <div class="sheet-head"><h2 style="font-size:19px">Update sale status</h2>
      <div class="sub">Refresh which units are sold, pending, or coming soon.</div></div>
    <div class="sheet-body">
      <div class="field-note" style="margin-bottom:10px">On a computer, open the builder's live map, run the bookmarklet below to copy the current data, then paste it here. (Your neighbors and photos are never touched — only sale status changes.)</div>
      <label class="fld"><span class="lab">Paste data here</span>
        <textarea class="inp" id="statusPaste" placeholder='[{"id":108954,"s":6,"pr":0}, ...]' style="min-height:120px;font-family:var(--mono);font-size:13px"></textarea></label>
      <button class="btn primary block" id="applyStatus">Apply update</button>
      <div class="section-label" style="margin-top:20px">Bookmarklet <span style="font-weight:400;text-transform:none;letter-spacing:0">(computer)</span></div>
      <div class="field-note">Drag-save or copy this as a bookmark, open the map, then tap it:</div>
      <textarea class="inp" readonly id="bmText" style="min-height:72px;font-family:var(--mono);font-size:11px">${esc(BM)}</textarea>
      <button class="btn block ghost" id="copyBM" style="margin-top:8px">Copy bookmarklet</button>
      <button class="btn block ghost" id="resetStatus" style="margin-top:8px">Reset to original snapshot (${esc(DATA.captured)})</button>
    </div>`;
  showSheet(true);
  $('#copyBM').onclick=()=>{navigator.clipboard.writeText($('#bmText').value).then(()=>toast('Bookmarklet copied'),()=>{$('#bmText').select();});};
  $('#applyStatus').onclick=()=>{
    let arr; try{arr=JSON.parse($('#statusPaste').value);}catch(e){toast('That isn’t valid data');return;}
    if(!Array.isArray(arr)){toast('Expected a list of units');return;}
    let n=0;
    arr.forEach(r=>{const l=byId[r.id]; if(!l)return;
      const s=+r.s; const lab=DATA.statusLegend[s]||('Status '+s);
      STATE.status[l.id]={status:s,statusLabel:lab,price:r.pr||0}; n++;});
    STATE.statusUpdated=new Date().toISOString().slice(0,10);
    persist(); refreshMap(); showSheet(false); toast('Updated '+n+' units');
  };
  $('#resetStatus').onclick=()=>{STATE.status={};STATE.statusUpdated=DATA.captured;persist();refreshMap();showSheet(false);toast('Reset to original snapshot');};
}

/* ---------------- helpers ---------------- */
function mapLabel(l){ if(l.addr){const m=l.addr.match(/^\s*(\d+)/); if(m) return m[1];} return l.lot; }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initials(n){if(!n)return'';return n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function resizeImage(file,max,q){return new Promise(res=>{
  const img=new Image(); img.onload=()=>{
    let{width:w,height:h}=img; const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc);h=Math.round(h*sc);
    const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    res(c.toDataURL('image/jpeg',q));
  }; img.onerror=()=>res(null); img.src=URL.createObjectURL(file);
});}
let toastT;
function toast(msg){let t=$('#toast'); if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2100);}

$('#scrim').onclick=()=>showSheet(false);

/* ---------------- boot ---------------- */
(async function boot(){
  try{const th=localStorage.getItem('cctheme'); if(th&&th!=='system')document.documentElement.setAttribute('data-theme',th);}catch(e){}
  await Store.open();
  const saved=await Store.load();
  if(saved&&saved.units)STATE=Object.assign(STATE,saved);
  buildMap(); buildLegend();
  const tryFit=()=>{ if($('#mapview').clientWidth>0){ fitMap(); } else { requestAnimationFrame(tryFit); } };
  requestAnimationFrame(tryFit);
})();
</script>
